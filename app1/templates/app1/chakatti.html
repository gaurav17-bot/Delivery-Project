{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chakatti</title>
    <link rel="stylesheet" href="{% static 'app1/hotels.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
    rel="stylesheet"
    />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
     {#  navigation part  #}
    <nav class="navbar">
        <div class="logo">
            <img src="{% static 'app1/images/logo.png' %}" alt="logo">
        </div>

        <section class="search">
        <div class="search-box">
                <input type="text" placeholder="Search for food items..." />
                <button><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </section>

        <div class="auth">
            {% if username %}
            <div style="display: flex; ">
                <div class="user" style="display:  flex; gap: 10px; margin-right: 20px ;align-items: center; flex-direction: column; margin-bottom: 5px;">
                    <i class="ri-user-fill" style="border: 1px solid rgb(210, 210, 210); padding: 10px; border-radius: 50%; background-color: rgb(224, 224, 224); font-size: 10px;"></i> <p style="  font-family: Arial, Helvetica, sans-serif;"> {{ username }}</p>
                </div>
                <a href="{% url 'logout' %}" style=" font-size: large; text-decoration: none; margin-right: -20px; border-radius: 10px; padding: 5px 20px; height: 40px; margin-top:10px ; " class="login">Logout</a>
            </div>

            {% else %}
            <a href="{% url 'login' %}" class="login" style=" font-size: large; margin-right:  ; text-decoration: none; border-radius: 10px; padding: 10px 50px;">Login</a>
            <a href="{% url 'register' %}" class="register" style=" font-size: large; text-decoration: none; margin-right: -20px; border-radius: 10px; padding: 10px 50px;">Register</a>    
            {% endif %}   
        </div>
    </nav>
    <p>chakatti</p>
</body>
</html>
